  # --- slu-svr-lin02 --------------------------------------------------------
  # Both instances hold no flow at all: no flows.json, no flows_cred.json,
  # /data untouched since Jul 2025. What they are for is still undecided
  # (docs/open-questions.md, question 4) — but they carry an app, so CI builds
  # their images and the pipeline can reach them the day a flow exists. Until
  # then apps/slu-*/flows.json is `[]`, which is what the instances hold, so a
  # deploy is a no-op rather than a change.
  #
  # One consequence worth knowing: an ALL run includes them. Building a flow in
  # the browser and not capturing it would make the next deploy of `[]` a
  # deletion — `nr.py check` before a deploy is what covers that, and an empty
  # flow makes drift on these two unusually easy to read.
  - name: slu-prod
    host: slu-svr-lin02
    compose_service: node-red-prod
    compose_file: /home/administrator/Base_Container/docker-compose.yml
    app: slu-prod
    admin_root: /node-red-prod
    auth_credential_id: nodered-slu-prod-auth
    credential_secret_id: nodered-slu-prod-credsecret
    dns_search: [rah.polipol.intra]
    image_tag: harbor.aks-infra.polipol-service.de/dap-node-red/slu-prod:4.0.9-1  # running node-red 4.0.9, empty
    variables: {}

  - name: slu-test
